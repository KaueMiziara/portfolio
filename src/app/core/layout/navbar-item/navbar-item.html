<a
  [routerLink]="route()"
  routerLinkActive="text-rune-blue drop-shadow-[0_0_8px_rgba(56,189,248,0.6)]"
  [routerLinkActiveOptions]="{ exact: true }"
  class="font-gothic text-xl md:text-2xl text-chainmail transition-all duration-300 ease-in-out cursor-pointer hover:text-rune-blue hover:drop-shadow-[0_0_8px_rgba(56,189,248,0.4)] mt-1"
>
  <span [class.md:hidden]="labelDesktop()">
    {{ label() }}
  </span>

  @if (labelDesktop()) {
    <span class="hidden md:inline">
      {{ labelDesktop() }}
    </span>
  }
</a>
