<div
  class="quantum-card group relative h-full bg-armor-plate p-6 transition-all duration-300 ease-out"
  [class.gold-variant]="variant() === 'gold'"
  [class.is-open]="isOpen()"
  (click)="toggle()"
>
  <div class="flex justify-between items-start mb-4">
    <h3
      class="font-roman text-xl text-polished-silver group-hover:text-rune-blue transition-colors"
    >
      {{ title() }}
    </h3>
    <div
      class="font-roman text-2xl text-chainmail group-hover:text-rune-blue transition-colors icon-glow"
    >
      {{ icon() }}
    </div>
  </div>

  <div class="text-chainmail text-sm md:text-base mb-2">
    <ng-content></ng-content>
  </div>

  <div
    class="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-500 ease-in-out"
    [class.grid-rows-[1fr]]="isOpen()"
  >
    <div class="overflow-hidden">
      <div
        class="h-px w-full bg-chainmail/20 my-3 opacity-0 group-hover:opacity-10 transition-opacity duration-300 delay-100"
        [class.opacity-100]="isOpen()"
      ></div>

      <div class="text-sm text-chainmail/80 pb-2">
        <ng-content select="[details]"></ng-content>
      </div>
    </div>
  </div>
</div>
